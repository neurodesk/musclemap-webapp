# .github/workflows/deploy.github-pages.yml
# FALLBACK deploy (if not using Cloudflare). Builds all apps, assembles ONE artifact
# with per-app subdirectories, and deploys ONCE — so jobs never race the single Pages site.
#
# Note: with this model every app lives under a subpath (neurodesk.github.io/webapps/<app>/),
# which does NOT preserve per-app *.neurodesk.org domains. Prefer Cloudflare (deploy.cloudflare.md).
name: deploy-github-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Build every app through Turbo (cached). Each app's Vite `base` must be /<app>/
      # so its assets resolve under the subdirectory it is assembled into.
      - run: pnpm exec turbo run build

      # Assemble a single site: site/<app>/ = apps/<app>/dist
      - name: Assemble one artifact
        run: |
          set -euo pipefail
          mkdir -p site
          for app in apps/*/; do
            name=$(basename "$app")
            if [ -d "$app/dist" ]; then
              mkdir -p "site/$name"
              cp -r "$app/dist/." "site/$name/"
            fi
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4 # single deploy — no per-app race
