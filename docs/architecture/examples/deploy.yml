# .github/workflows/deploy.yml
# Builds every app and deploys each to its own GitHub Pages target.
# Assumes each app produces a static ./dist via `pnpm --filter <app> build`.
name: deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        # Emit the list of app directory names as a JSON array for the matrix.
        run: |
          apps=$(ls -1 apps | jq -R -s -c 'split("\n") | map(select(length>0))')
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  build-deploy:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo only rebuilds this app + changed deps.
      - run: pnpm --filter ${{ matrix.app }} build
        env:
          # Serve each app from /<app>/ when hosting many apps on one Pages site.
          BASE_PATH: /${{ matrix.app }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ matrix.app }}
